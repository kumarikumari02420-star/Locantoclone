<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Locanto Clone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Locanto Clone</h1>
  <p>Buy • Sell • Services</p>
</header>

<nav>
  <a href="#">Home</a>
  <a href="#">Categories</a>
  <a href="#">Post Ad</a>
  <a href="#">Login</a>
</nav>

<div class="container">
  <div class="card">
    <h2>Post Free Ads</h2>
    <p>Buy and sell anything near you.</p>
    <button>Post Ad</button>
  </div>

  <div class="card">
    <h2>Latest Ads</h2>
    <p>No ads available yet.</p>
  </div>
</div>

<script src="script.js"></script>

</body>
</html>
<div class="card">
  <h2>Post Your Ad</h2>

  <input type="text" placeholder="Ad Title" style="width:100%;padding:10px;margin:8px 0;">

  <select style="width:100%;padding:10px;margin:8px 0;">
    <option>Select Category</option>
    <option>Cars</option>
    <option>Mobiles</option>
    <option>Jobs</option>
    <option>Property</option>
    <option>Services</option>
  </select>

  <textarea placeholder="Description" style="width:100%;height:120px;padding:10px;margin:8px 0;"></textarea>

  <input type="file" style="margin:8px 0;">

  <button>Submit Ad</button>
</div>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Locanto Clone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Login</h1>
</header>

<div class="container">
  <div class="card">
    <input type="email" placeholder="Email" style="width:100%;padding:10px;margin:10px 0;">
    <input type="password" placeholder="Password" style="width:100%;padding:10px;margin:10px 0;">
    <button style="width:100%;">Login</button>

    <p style="margin-top:15px;">
      Don't have an account? <a href="#">Sign Up</a>
    </p>
  </div>
</div>

</body>
</html>
